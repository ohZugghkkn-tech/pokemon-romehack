name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          python -m pip install -r requirements-dev.txt
      - name: Run host checks (not a ROM or release approval)
        run: python scripts/check.py

  shader-and-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Compile actual preset stages with pinned glslang
        run: |
          npm ci --prefix scripts/shader-tools --ignore-scripts
          npm test --prefix scripts/shader-tools
      - name: Install browser test dependencies
        working-directory: soulgold
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run browser integration at three viewport widths
        working-directory: soulgold
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory docs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 - <<'PYTHON'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/", timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("Documentation server did not become ready")
          PYTHON
          node --test tools/soulgold_docs/tests/frontier-browser.test.mjs

  target-build-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPARE: '0'
    defaults:
      run:
        working-directory: soulgold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ARM and host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev libelf-dev python3
      - name: Record compiler versions
        run: |
          arm-none-eabi-gcc --version
          gcc --version
          make --version
      - name: Build normal SoulGold ROM
        run: make -j2 all
      - name: Run full target test suite
        run: make -j2 check-all
      # No ROM upload, release publication, secrets, or save fixtures here.
      # Inspect the actual run; host checks cannot substitute target results.
