name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          python -m pip install -r requirements-dev.txt
      - name: Run host checks (not a ROM or release approval)
        run: python scripts/check.py

  target-build-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPARE: '0'
    defaults:
      run:
        working-directory: soulgold
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install ARM and host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev libelf-dev python3
      - name: Record compiler versions
        run: |
          arm-none-eabi-gcc --version
          gcc --version
          make --version
      - name: Build normal SoulGold ROM
        run: make -j2 all
      - name: Run full target test suite
        run: make -j2 check-all
      # No ROM upload, release publication, secrets, or save fixtures here.
      # Execution on GitHub is still pending; host checks cannot substitute it.
